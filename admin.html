<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arabic Quiz • Private Dashboard</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;margin:0;background:#fff7e9;color:#29231d;padding:24px}.wrap{max-width:1000px;margin:auto}h1{color:#6d3bb6}.panel{background:white;padding:20px;border-radius:18px;box-shadow:0 8px 25px #0001;margin-bottom:18px}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ccc;margin:6px 0}input{width:100%}button{background:#6d3bb6;color:white;border:0;font-weight:700;cursor:pointer}.logout{background:#555}.hide{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#faf8ff;padding:16px;border-radius:14px;text-align:center}.stat b{font-size:28px;display:block}table{border-collapse:collapse;background:white;width:100%}td,th{border-bottom:1px solid #e5e5e5;padding:10px;text-align:left}th{background:#faf8ff}.winner{font-weight:800;color:#087a38}.scroll{overflow-x:auto}.error{color:#b42318}.small{font-size:13px;color:#666}@media(max-width:620px){.stats{grid-template-columns:1fr}body{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🔒 Organizer Dashboard</h1>
<section id="loginBox" class="panel">
  <h2>Admin sign in</h2>
  <p class="small">This login is only for the exhibition organizer. Visitors do not need an email.</p>
  <input id="email" type="email" placeholder="Admin email" autocomplete="username">
  <input id="password" type="password" placeholder="Admin password" autocomplete="current-password">
  <button onclick="login()">Sign in</button>
  <p id="loginMsg" class="error"></p>
</section>

<section id="dashboard" class="hide">
  <div class="panel">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
      <div><strong id="who"></strong><div class="small">Live exhibition results</div></div>
      <div><button onclick="downloadCSV()">Export CSV</button> <button class="logout" onclick="logout()">Sign out</button></div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><b id="visitors">0</b>Visitors</div>
    <div class="stat"><b id="winners">0</b>Winners</div>
    <div class="stat"><b id="perfect">0%</b>3/3 rate</div>
  </div>
  <div class="panel scroll" style="margin-top:18px">
    <table>
      <thead><tr><th>Name</th><th>Level</th><th>Score</th><th>Chocolate?</th><th>Time</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="small">No results yet.</p>
  </div>
</section>
</div>

<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const auth=firebase.auth();
let allResults=[];
let unsubscribe=null;
const $=id=>document.getElementById(id);

async function login(){
  $('loginMsg').textContent='';
  try{
    await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value);
  }catch(err){
    console.error(err);
    $('loginMsg').textContent='Sign in failed. Check the email/password and Firebase setup.';
  }
}

async function logout(){
  if(unsubscribe){unsubscribe();unsubscribe=null;}
  await auth.signOut();
}

auth.onAuthStateChanged(user=>{
  if(user){
    $('loginBox').classList.add('hide');
    $('dashboard').classList.remove('hide');
    $('who').textContent=user.email || 'Signed in';
    watchResults();
  }else{
    $('loginBox').classList.remove('hide');
    $('dashboard').classList.add('hide');
    $('rows').innerHTML='';
    allResults=[];
  }
});

function watchResults(){
  if(unsubscribe)unsubscribe();
  unsubscribe=db.collection('results').orderBy('createdAt','desc').onSnapshot(snap=>{
    allResults=snap.docs.map(doc=>({id:doc.id,...doc.data()}));
    renderRows();
  },err=>{
    console.error(err);
    $('empty').textContent='Could not read results. Check your Firestore rules and admin UID.';
    $('empty').style.display='block';
  });
}

function renderRows(){
  const body=$('rows');body.innerHTML='';
  allResults.forEach(x=>{
    const tr=body.insertRow();
    const time=x.createdAt?.toDate ? x.createdAt.toDate().toLocaleString() : 'Saving…';
    const values=[x.name,x.level,`${x.score}/${x.total}`,x.won?'🍫 Winner':'No',time];
    values.forEach((v,i)=>{const td=tr.insertCell();td.textContent=v;if(i===3&&x.won)td.className='winner';});
  });
  const winCount=allResults.filter(x=>x.won).length;
  $('visitors').textContent=allResults.length;
  $('winners').textContent=winCount;
  $('perfect').textContent=allResults.length?Math.round(winCount/allResults.length*100)+'%':'0%';
  $('empty').style.display=allResults.length?'none':'block';
  $('empty').textContent='No results yet.';
}

function csvCell(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function downloadCSV(){
  const rows=[['Name','Level','Score','Won','Time'],...allResults.map(x=>[
    x.name,x.level,`${x.score}/${x.total}`,x.won?'Yes':'No',x.createdAt?.toDate?x.createdAt.toDate().toLocaleString():''
  ])];
  const csv=rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='arabic-quiz-results.csv';a.click();URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
