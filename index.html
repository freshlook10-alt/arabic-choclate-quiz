
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arabic Chocolate Challenge</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(145deg,#fff3cd,#eee0ff);
  color: #30243d;
}
main {
  max-width: 560px;
  margin: 20px auto;
  padding: 26px;
  background: white;
  border-radius: 24px;
  box-shadow: 0 10px 35px #0002;
}
h1 { color: #7539ad; text-align: center; }
h2, .center { text-align: center; }
.subtitle { text-align: center; color: #665b70; }
button, input, select {
  font: inherit;
  display: block;
  width: 100%;
  padding: 14px;
  margin: 12px 0;
  border-radius: 12px;
}
input, select { border: 1px solid #cfc7db; }
button {
  border: none;
  background: #7539ad;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: .55; }
.picture { font-size: 100px; text-align: center; margin: 18px 0; }
.question { font-size: 23px; font-weight: bold; text-align: center; }
.hide { display: none; }
.good { color: #168143; font-weight: bold; }
.bad { color: #bb2525; font-weight: bold; }
.prize {
  background: #e9fbed;
  border-radius: 18px;
  padding: 22px;
  text-align: center;
  font-size: 20px;
}
.noPrize {
  background: #fff0ee;
  border-radius: 18px;
  padding: 22px;
  text-align: center;
}
small { color: #777; line-height: 1.5; }
#status { font-size: 14px; text-align: center; }
</style>
</head>

<body>
<main>
<h1>🍫 Arabic Chocolate Challenge</h1>
<p class="subtitle">Get at least 1/3 correct to qualify for chocolate!</p>

<section id="welcome">
  <h2>Welcome!</h2>
  <label>Your name</label>
  <input id="playerName" maxlength="35" placeholder="Enter your name">

  <label>Choose your Arabic level</label>
  <select id="level">
    <option value="beginner">Beginner</option>
    <option value="intermediate">Intermediate</option>
    <option value="advanced">Advanced</option>
  </select>

  <button onclick="startQuiz()">Start Quiz 🚀</button>
  <small>No email needed. Your name, level and result will be
  shared with the exhibition organizer.</small>
</section>

<section id="quiz" class="hide">
  <p id="progress" class="center"></p>
  <div id="picture" class="picture"></div>
  <p class="question">What is the Arabic word for this picture?</p>
  <div id="options"></div>
  <p id="feedback"></p>
  <button id="nextBtn" class="hide" onclick="nextQuestion()">Next →</button>
</section>

<section id="result" class="hide">
  <h2 id="scoreText"></h2>
  <div id="prizeBox">
    <h2 id="prizeText"></h2>
    <p id="approvalText"></p>
  </div>
  <p id="status"></p>
  <button onclick="location.reload()">New Visitor</button>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

let questions = [];
let questionNumber = 0;
let score = 0;
let playerName = "";
let level = "";
let locked = false;
let approvalListener = null;

const el = id => document.getElementById(id);

function shuffle(array) {
  const copy = [...array];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function createQuestions(selectedLevel) {
  const bank = wordBanks[selectedLevel];
  const selected = shuffle(bank).slice(0, 3);

  return selected.map(([picture, correct]) => {
    const wrong = shuffle(
      bank.filter(item => item[1] !== correct)
    ).slice(0, 2).map(item => item[1]);

    const options = shuffle([correct, ...wrong]);

    return {
      picture: picture,
      options: options,
      correct: options.indexOf(correct)
    };
  });
}

function startQuiz() {
  playerName = el("playerName").value.trim();

  if (!playerName) {
    alert("Please enter your name.");
    return;
  }

  level = el("level").value;
  questions = createQuestions(level);
  questionNumber = 0;
  score = 0;

  el("welcome").classList.add("hide");
  el("quiz").classList.remove("hide");

  showQuestion();
}

function showQuestion() {
  locked = false;
  const q = questions[questionNumber];

  el("progress").textContent =
    `Question ${questionNumber + 1} of 3`;

  el("picture").textContent = q.picture;
  el("feedback").textContent = "";
  el("feedback").className = "";
  el("nextBtn").classList.add("hide");

  const container = el("options");
  container.replaceChildren();

  q.options.forEach((option, index) => {
    const button = document.createElement("button");
    button.textContent = option;
    button.dir = "rtl";
    button.onclick = () => chooseAnswer(index);
    container.appendChild(button);
  });
}

function chooseAnswer(answerIndex) {
  if (locked) return;
  locked = true;

  const q = questions[questionNumber];

  if (answerIndex === q.correct) {
    score++;
    el("feedback").textContent = "✅ Correct!";
    el("feedback").className = "good";
  } else {
    el("feedback").textContent =
      "❌ Wrong! Correct answer: " + q.options[q.correct];
    el("feedback").className = "bad";
  }

  [...el("options").children].forEach(button => {
    button.disabled = true;
  });

  el("nextBtn").textContent =
    questionNumber === 2 ? "See Result →" : "Next →";

  el("nextBtn").classList.remove("hide");
}

function nextQuestion() {
  questionNumber++;

  if (questionNumber < 3) {
    showQuestion();
  } else {
    finishQuiz();
  }
}

async function finishQuiz() {
  el("quiz").classList.add("hide");
  el("result").classList.remove("hide");

  el("scoreText").textContent =
    `${playerName}, you scored ${score}/3!`;

  const won = score >= 1;

  el("prizeBox").className = won ? "prize" : "noPrize";

  if (won) {
    el("prizeText").textContent =
      "🍫 You qualify for a chocolate!";

    el("approvalText").textContent =
      "⏳ Waiting for admin approval. Keep this page open.";
  } else {
    el("prizeText").textContent = "No chocolate this time.";
    el("approvalText").textContent =
      "You need at least 1 correct answer.";
  }

  el("status").textContent = "Saving your score...";

  try {
    const reference = db.collection("results").doc();

    await reference.set({
      name: playerName,
      level: level,
      score: score,
      total: 3,
      won: won,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    el("status").textContent = "✅ Result saved!";

    if (won) {
      approvalListener = db.collection("approvals")
        .doc(reference.id)
        .onSnapshot(snapshot => {
          if (snapshot.exists && snapshot.data().accepted === true) {
            el("prizeText").textContent =
              "🎉 Your win has been accepted by the admin! 🍫";

            el("approvalText").textContent =
              "Show this screen to collect your chocolate.";
          }
        }, error => {
          console.error(error);
          el("approvalText").textContent =
            "Please ask the organizer to confirm your win.";
        });
    }
  } catch (error) {
    console.error(error);
    el("status").textContent =
      "⚠️ Score not saved. Please ask the organizer for help.";
  }
}
