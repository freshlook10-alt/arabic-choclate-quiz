}));

function shuffle(a){
a=[...a];
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

function code(id){
if(!/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(id||""))
return "LEGACY";

const alphabet="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
let n=BigInt("0x"+id.replace(/-/g,"").slice(0,10));
let out="";

for(let i=0;i<8;i++){
out=alphabet[Number(n%32n)]+out;
n/=32n;
}
return out.slice(0,4)+"-"+out.slice(4);
}

async function register(){
try{
deviceId=localStorage.getItem(DEVICE_KEY);
if(!deviceId){
deviceId=crypto.randomUUID();
localStorage.setItem(DEVICE_KEY,deviceId);
}
const ref=db.collection("devices").doc(deviceId);
const counter=db.collection("meta").doc("visitorCounter");

device=await db.runTransaction(async tx=>{
const old=await tx.get(ref);
if(old.exists)return old.data();

const last=await tx.get(counter);
const number=last.exists?last.data().nextNumber:1;
if(number>999999)throw Error("Registration limit reached");

tx.set(counter,{nextNumber:number+1});
tx.set(ref,{
number,firstResultId:null,
createdAt:firebase.firestore.FieldValue.serverTimestamp()
});
return {number,firstResultId:null};
});

$("visitorCode").textContent=code(deviceId);
$("warning").classList.toggle("hide",!device.firstResultId);
$("start").disabled=false;
$("start").textContent="🚀 Start Quiz";
}catch(e){
console.error(e);
$("status").textContent="Connection failed. Check Firebase Rules and internet, then reload.";
}
}

function questionsFor(level,n){
const pool=words[level];
const offset={beginner:151,intermediate:331,advanced:977}[level];
const index=((n*7919+offset)%10000+10000)%10000;
let rank=(index*97+317)%(50*49*48),ids=[];

for(const width of [50,49,48]){
const available=Array.from({length:50},(_,i)=>i)
.filter(i=>!ids.includes(i));
ids.push(available[rank%width]);
rank=Math.floor(rank/width);
}

const q=ids.map(i=>{
const [picture,right]=pool[i];
const wrong=shuffle(pool.filter(x=>x[1]!==right))
.slice(0,2).map(x=>x[1]);
const options=shuffle([right,...wrong]);
return {picture,options,correct:options.indexOf(right)};
});

if(level==="advanced"&&Math.floor(Math.random()*159)===0){
const s=rare[Math.floor(Math.random()*rare.length)];
const options=shuffle(s.options);
const i=Math.floor(Math.random()*3);
q[i]={sentence:s.text,options,correct:options.indexOf(s.right)};
}

return {q,quizSet:index+1};
}

function start(){
if(!device||game)return;

const name=$("name").value.trim().replace(/\s+/g," ");
if(!name){
$("status").textContent="Enter your name first.";
return;
}

const level=$("level").value;
const attempt=Number(localStorage.getItem(ATTEMPT_KEY)||"0")+1;
localStorage.setItem(ATTEMPT_KEY,String(attempt));

const {q,quizSet}=questionsFor(level,device.number+attempt-1);
game={
name,level,q,quizSet,i:0,score:0,choice:null,
phase:"playing",retry:!!device.firstResultId
};

$("welcome").classList.add("hide");
$("quiz").classList.remove("hide");
showQuestion();
}

function showQuestion(){
const q=game.q[game.i],answered=game.choice!==null;
$("progress").textContent=`Question ${game.i+1}/3 · ${game.score} correct`;
$("bar").style.width=(100*(game.i+(answered?1:0))/3)+"%";
$("picture").textContent=q.sentence?"✍️":q.picture;
$("hint").textContent=q.sentence?
"RARE ADVANCED CHALLENGE — Fill the blank!":"";
$("question").textContent=q.sentence||
"What is the Arabic word for this picture?";
$("question").classList.toggle("ar",!!q.sentence);
$("choices").replaceChildren();

q.options.forEach((x,i)=>{
const b=document.createElement("button");
b.textContent=x;
b.disabled=answered;
b.onclick=()=>choose(i);
$("choices").appendChild(b);
});

$("feedback").textContent=!answered?"":game.choice===q.correct?
"✅ Correct!":"❌ Wrong! Correct answer: "+q.options[q.correct];

$("feedback").className="center "+(game.choice===q.correct?"good":"bad");
$("next").classList.toggle("hide",!answered);
$("next").textContent=game.i===2?"See My Result 🎁":"Next →";
}

function choose(i){
if(!game||game.choice!==null)return;
if(i===game.q[game.i].correct)game.score++;
game.choice=i;
showQuestion();
}

function next(){
if(game.choice===null)return;
if(game.i<2){
game.i++;game.choice=null;showQuestion();
}else finish();
}

function result(){
const reward=game.first?prize(game.score):"none";
$("quiz").classList.add("hide");
$("result").classList.remove("hide");
$("resultBox").className="result "+reward;
$("resultIcon").textContent=reward==="chocolate"?"🏆🍫":
reward==="toffee"?"🍬":"🌟";
$("resultScore").textContent=`${game.name}: ${game.score}/3`;

$("resultTitle").textContent=!game.first?
"Practice attempt — no prize":
reward==="chocolate"?"Chocolate Champion!":
reward==="toffee"?"Toffee Star!":"Thank you for playing!";

$("resultInfo").textContent=!game.first?
"Repeated attempt — no prize.":
reward==="none"?"No prize for this score.":
`You earned one ${reward}! Waiting for admin approval.`;

$("warning").classList.toggle("hide",!!game.first);
$("saveStatus").textContent=game.phase==="saving"?"Saving result…":
game.phase==="failed"?"⚠️ Result not saved. Ask the organizer.":
"✅ Result saved!";
}

async function finish(){
if(game.phase!=="playing")return;
game.phase="saving";
game.first=!game.retry;
result();

try{
const devRef=db.collection("devices").doc(deviceId);
const resultRef=db.collection("results").doc();

const first=await db.runTransaction(async tx=>{
const snap=await tx.get(devRef);
if(!snap.exists)throw Error("Visitor code missing");

const first=!snap.data().firstResultId;
if(first)tx.update(devRef,{firstResultId:resultRef.id});

tx.set(resultRef,{
name:game.name,
level:game.level,
score:game.score,
total:3,
won:first&&game.score>=2,
firstAttempt:first,
deviceId,
visitorNumber:snap.data().number,
quizSet:game.quizSet,
createdAt:firebase.firestore.FieldValue.serverTimestamp()
});
return first;
});

game.first=first;
game.id=resultRef.id;
game.phase="saved";
device.firstResultId=device.firstResultId||game.id;
result();

if(first&&game.score>=2)watchApproval();
}catch(e){
console.error(e);
game.phase="failed";
result();
}
}

function watchApproval(){
stopApproval=db.collection("approvals").doc(game.id)
.onSnapshot(s=>{
if(!s.exists||s.data().accepted!==true)return;
const approval=s.data(),reward=prize(game.score);

$("result").classList.add("hide");
$("ticket").classList.remove("hide");
$("ticket").className="ticket "+reward;
$("ticketIcon").textContent=reward==="chocolate"?"🏆🍫":"🌟🍬";
$("ticketPrize").textContent=reward==="chocolate"?
"CHOCOLATE CHAMPION":"TOFFEE STAR";
$("ticketName").textContent=game.name;
$("ticketScore").textContent=game.score+"/3 · "+game.level;
$("ticketCode").textContent=code(deviceId);
$("ticketId").textContent=game.id.slice(-8).toUpperCase();
$("ticketTime").textContent=date(
approval.acceptedAt?.toDate?
approval.acceptedAt.toDate():new Date()
);
$("ticketBanner").textContent="SHOW THIS SCREEN TO COLLECT YOUR "+
reward.toUpperCase();
$("certificate").classList.toggle("hide",reward!=="chocolate");

if(stopApproval){stopApproval();stopApproval=null;}
},e=>{
console.error(e);
$("saveStatus").textContent="Cannot check approval. Ask organizer.";
});
}

$("level").onchange=theme;
$("start").onclick=start;
$("next").onclick=next;
theme();
register();
</script>
</body>
</html>
